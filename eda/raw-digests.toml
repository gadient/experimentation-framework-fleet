# Expected SHA-256 of every raw TLC artifact the analysis reads.
#
# `data/raw/` is not tracked, so before this file existed nothing in the repository recorded which
# bytes the fits were made from. `eda/fetch_data.py` wrote `data/raw/MANIFEST.txt` from whatever was
# on disk at the time, which means the manifest could never disagree with the disk: it recorded, it
# did not verify. This file is the expectation the disk is checked against.
#
# Two places read it. `eda/common.py` verifies the files a notebook is about to open, once per
# process, before duckdb sees them. `eda/fetch_data.py` compares after each fetch and reports a
# difference instead of silently writing the new digest over the old one.
#
# **A mismatch has two causes and the tools do not guess between them.** The local copy may be
# damaged or truncated, or the TLC may have republished that month in place — they revise files
# after publication, so a changed digest is not by itself evidence of a corrupt download. Re-fetch
# with `--force` and compare. If upstream genuinely moved, update the entry here in its own commit,
# so a change to the empirical inputs appears in the history rather than passing unnoticed.
#
# Verification is a report, never a refusal: a run that cannot confirm its inputs still proceeds and
# says so. Refusing would make an upstream revision look like a broken repository.
#
# Digests computed 2026-09-17 by reading the working copy, and cross-checked against the
# `data/raw/MANIFEST.txt` written 2026-09-03. All eight agreed.

